name: Continuous Integration

on:
  pull_request:
    branches:
      - master
      - staging
  push:
    branches:
      - master
      - staging

jobs:
  tests:
    name: 'Linter and Unit Tests'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}
      - run: make ci
  